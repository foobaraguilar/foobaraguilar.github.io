          setFavicon();
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        var stored = localStorage.getItem('theme');
        if (stored === 'dark') {
          applyTheme('dark');
        } else {
          applyTheme('light');
        }

        toggle.addEventListener('click', function () {
          var next = body.classList.contains('theme-dark') ? 'light' : 'dark';
          applyTheme(next);
        });
      })();
    </script>
