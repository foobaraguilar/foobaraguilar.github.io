<script>
const stops=[
{name:'Soon & Soon',short:'Soon & Soon',food:'Coffee.',type:'Coffee first',address:'731 Grant Avenue',x:240,y:367,tx:258,ty:360,desc:'Mister Jiu’s × Paper Son Coffee.',photo:'assets/coffee.webp',alt:'Soon and Soon storefront on Grant Avenue',credit:'Photo: Paper Son Coffee',source:'https://papersoncoffee.com/locations'},
{name:'Capital',short:'Capital',food:'Salt & pepper wings.',type:'Something crispy',address:'839 Clay Street',x:135,y:415,tx:111,ty:444,desc:'',source:'https://www.theinfatuation.com/san-francisco/reviews/capital'},
{name:'iCafe',short:'iCafe',food:'Mango mochi.',type:'A sweet detour',address:'133 Waverly Place',x:168,y:264,tx:185,ty:258,desc:'',source:'https://www.spotlightchinatown.com/icafe'},
{name:'Great Eastern',short:'Great Eastern',food:'Honey walnut shrimp + lo mein.',type:'Sit down & share',address:'649 Jackson Street',x:332,y:205,tx:345,ty:236,desc:'Obama stopped here in 2012.',photo:'assets/great-eastern-obama.png',alt:'Barack Obama outside Great Eastern restaurant',credit:'Obama at Great Eastern',extraPhoto:'assets/great-eastern-wall.png',source:'https://obamawhitehouse.archives.gov/photos-and-video/photo/2012/02/president-obama-great-eastern-restaurant'},
{name:'Z & Y',short:'Z & Y',food:'Honey walnut shrimp + lo mein.',type:'The alternative',address:'655 Jackson Street',x:272,y:205,tx:242,ty:170,desc:'An alternative to Great Eastern.',source:'https://www.zandyrestaurant.com/location/'},
{name:'Hon’s Wun-Tun House',short:'Hon’s Wun-Tun',food:'Wonton noodle soup.',type:'Noodle break',address:'648 Kearny Street',x:390,y:440,tx:408,ty:455,desc:'',source:'https://www.honswuntunsf.com/'},
{name:'House of Nanking',short:'House of Nanking',food:'Beef noodle soup.',type:'One more bowl',address:'919 Kearny Street',x:390,y:60,tx:408,ty:54,desc:'',source:'https://www.houseofnankingsf.com/about/'},
{name:'Kissakeko',short:'Kissakeko',food:'Sake + jazz.',photo:'assets/kissakeko.jpg',alt:'Kissakeko storefront on Mason Street, photographed by Ruben',credit:'Photo: Ruben',type:'Sake & jazz',address:'1327 Mason Street',x:-100,y:55,tx:-82,ty:53,desc:'Alex, the owner, is very sweet.',source:'https://www.corner.inc/place/pbdAPxt37Y7a?listId=71b53428-62f6-4806-a150-29a06a0ac062'},
{name:'Cable Car Museum',short:'Cable Car Museum',food:'Looks fun to explore.',type:'Sightseeing',address:'1201 Mason Street',x:-100,y:290,tx:-83,ty:280,desc:'',source:'https://cablecarmuseum.org/info.html'},
{name:'New Asia Market',short:'New Asia Market',food:'A market detour.',type:'Sightseeing',address:'772 Pacific Avenue',x:165,y:100,tx:180,ty:85,desc:'',photo:'assets/new-asia-market.jpg',alt:'Produce and chandeliers inside New Asia Market',credit:'Photo: Ruben'}
];
let selected=0;const ns='http://www.w3.org/2000/svg';
stops.forEach((s,i)=>{const g=document.createElementNS(ns,'g');g.setAttribute('class','pin');g.style.setProperty('--stop-color',i>=8?'#6c77a6':[0,2,7].includes(i)?'#5a8178':'#bc793b');g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',`${s.name}, ${s.address}. Show stop details`);g.innerHTML=`<g class="orange-building" transform="translate(${s.x-19} ${s.y-29})"><rect class="wall" width="13" height="18"/><rect class="window" x="2" y="3" width="2" height="3"/><rect class="window" x="6" y="3" width="2" height="3"/><rect class="window" x="10" y="3" width="1" height="3"/><rect class="window" x="2" y="8" width="2" height="3"/><rect class="window" x="6" y="8" width="2" height="3"/><rect class="window" x="10" y="8" width="1" height="3"/><path d="M-3 20H16"/></g><circle class="halo" cx="${s.x}" cy="${s.y}" r="17"/><circle fill="transparent" cx="${s.x}" cy="${s.y}" r="${i===3||i===4?29:36}"/><circle class="dot" cx="${s.x}" cy="${s.y}" r="8"/><text class="num" x="${s.x}" y="${s.y+3}">${i+1}</text><text x="${s.tx}" y="${s.ty}">${s.short}</text>`;g.addEventListener('click',()=>select(i));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(i)}});document.querySelector('#pins').append(g);const b=document.createElement('button');b.className='stop';b.innerHTML=`<span class="index">0${i+1}${i===4?' / ALT':''}</span><strong>${s.short}</strong><small>${s.food}</small>`;b.addEventListener('click',()=>select(i));document.querySelector('#stops').append(b)});
function select(i){openSheet();selected=(i+stops.length)%stops.length;const s=stops[selected];document.querySelector('#detail').innerHTML=`<h2>${s.name}</h2><div id="pick-content"><p class="order">${s.food}</p>${s.desc?`<p class="description">${s.desc}</p>`:''}</div><div id="photo-content">${s.photo?`<figure class="photo"><img src="${s.photo}" alt="${s.alt}"><figcaption>${s.credit==='Photo: Ruben'||s.extraPhoto?s.credit:`<a href="${s.source}" target="_blank" rel="noopener">${s.credit} ↗</a>`}</figcaption></figure>${s.extraPhoto?`<figure class="photo"><img src="${s.extraPhoto}" alt="Framed photos displayed at Great Eastern"><figcaption>On the wall at Great Eastern</figcaption></figure>`:''}`:''}</div>`;document.querySelector('#address').textContent=s.address+', San Francisco, CA';document.querySelector('#copy-address').hidden=true;document.querySelector('#address').setAttribute('aria-expanded','false');document.querySelector('#copy-status').textContent='';document.querySelector('#directions').href='https://www.google.com/maps/dir/?api=1&travelmode=walking&destination='+encodeURIComponent(s.address+', San Francisco, CA');document.querySelectorAll('.pin').forEach((p,j)=>{p.classList.toggle('active',j===selected);p.setAttribute('aria-pressed',j===selected)});document.querySelectorAll('.stop').forEach((p,j)=>p.setAttribute('aria-pressed',j===selected));}
document.querySelector('#close').onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

const addressButton=document.querySelector('#address'),copyButton=document.querySelector('#copy-address');
let holdTimer,holdX,holdY;
function showCopy(){copyButton.hidden=false;addressButton.setAttribute('aria-expanded','true')}
function cancelHold(){clearTimeout(holdTimer)}
addressButton.addEventListener('pointerdown',e=>{holdX=e.clientX;holdY=e.clientY;holdTimer=setTimeout(showCopy,500)});
addressButton.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-holdX,e.clientY-holdY)>10)cancelHold()});
['pointerup','pointercancel','pointerleave'].forEach(event=>addressButton.addEventListener(event,cancelHold));
addressButton.addEventListener('contextmenu',e=>{e.preventDefault();showCopy()});
addressButton.addEventListener('click',showCopy);
copyButton.addEventListener('click',async()=>{
 const full=stops[selected].address+', San Francisco, CA';
 try{
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(full)}
  else{const input=document.createElement('textarea');input.value=full;input.style.position='fixed';input.style.opacity='0';document.body.append(input);input.focus();input.select();const copied=document.execCommand('copy');input.remove();if(!copied)throw new Error('Copy unavailable')}
  document.querySelector('#copy-status').textContent='Full address copied';copyButton.hidden=true;addressButton.setAttribute('aria-expanded','false');addressButton.focus();
 }catch{document.querySelector('#copy-status').textContent='Select and copy this address: '+full;const range=document.createRange();range.selectNodeContents(document.querySelector('#copy-status'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range)}
});


const sheet=document.querySelector('.panel'),backdrop=document.querySelector('.sheet-backdrop');let returnFocus;
function openSheet(){if(!sheet.classList.contains('open')){returnFocus=document.activeElement;sheet.inert=false;sheet.classList.add('open');backdrop.classList.add('open');requestAnimationFrame(()=>document.querySelector('#close').focus({preventScroll:true}))}sheet.scrollTop=0}
function closeSheet(){if(!sheet.classList.contains('open'))return;sheet.classList.remove('open');backdrop.classList.remove('open');sheet.inert=true;returnFocus?.focus({preventScroll:true})}
backdrop.addEventListener('click',closeSheet);
sheet.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const focusable=[...sheet.querySelectorAll('button,a[href],[tabindex="0"]')].filter(el=>el.getClientRects().length&&!el.disabled);const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
let swipeY;const handle=document.querySelector('.sheet-handle');handle.addEventListener('pointerdown',e=>{swipeY=e.clientY;handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointerup',e=>{if(swipeY!==undefined&&e.clientY-swipeY>45)closeSheet();swipeY=undefined});handle.addEventListener('pointercancel',()=>{swipeY=undefined});
</script></body></html>
